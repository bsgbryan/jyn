<!doctype html>
<html>
  <head>
    <title>jyn test client</title>
  </head>
  <body>
    <input type="url" name="url" id="url" placeholder="ws://localhost:1138">
    <button id="connect">connect</button>
    <script>
      let counter = Number(localStorage.getItem('counter') ?? 0)
      let ws
      let ping
      let active = Boolean(localStorage.getItem('active'))
      
      document.getElementById("url").value = localStorage.getItem('url')

      const fn = () => {
        if (active) {
          console.log(`SENT: ping: ${counter}`)
          ws.send(`ping: ${counter++}`)
        }
      }

      const init = () => {
        if (ws) {
          console.log('closing existing connection')
          ws.close()
          ws = undefined
          if (ping) {
            window.clearInterval(ping)
            ping = undefined
          }
        }

        const url = document.getElementById("url").value

        console.log(counter, active, url)

        ws = new WebSocket(url)

        ws.addEventListener("open", () => {
          console.log("CONNECTED")
          active = true
          if (!ping) ping = setInterval(fn, 1000)
        })

        ws.addEventListener("close", () => {
          console.log("DISCONNECTED")
          clearInterval(ping)
          ping = undefined
          ws = undefined
        })
      }

      console.log({active})

      if (active) init()

      document.getElementById("connect").addEventListener("click", init)

      window.addEventListener("pagehide", () => {
        console.log('hiding', active)
        if (ws) {
          console.log("CLOSING")

          localStorage.setItem('active', active ? "true": "")
          localStorage.setItem('counter', counter)
          localStorage.setItem('url', document.getElementById("url").value)

          window.clearInterval(ping)
          ws.close()
          ws = undefined
          ping = undefined
          active = false
        }
      })
    </script>
  </body>
</html>
